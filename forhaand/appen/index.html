async function aabn(kode) {
  const raa = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveKey']);
  const noegle = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.runder, hash: 'SHA-256'},
