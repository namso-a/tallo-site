const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function aabn(kode) {
  const raa = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveKey']);
  const noegle = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.runder, hash: 'SHA-256'},
    raa, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const klar = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, noegle, b64(P.data));
  const html = new TextDecoder().decode(klar);

  document.open(); document.write(html); document.close();
}

}
