const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function aabn(kode) {
  const raa = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveKey']);
  const noegle = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.runder, hash: 'SHA-256'},
    raa, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const klar = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, noegle, b64(P.data));
  const html = new TextDecoder().decode(klar);
  if (P.husk) sessionStorage.setItem(P.husk, kode);
  document.open(); document.write(html); document.close();
}
async function proev(kode) {
  document.getElementById('fejl').textContent = 'Åbner …';
  try { await aabn(kode.trim()); }
  catch (e) { if (P.husk) sessionStorage.removeItem(P.husk); document.getElementById('fejl').textContent = 'Forkert kodeord.'; }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); proev(document.getElementById('k').value); });
const h = new URLSearchParams(location.hash.slice(1)).get('k');

if (h) proev(h); else if (gemt) proev(gemt);
